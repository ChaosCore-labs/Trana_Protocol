[package]
name = "freight_delay"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "freight_delay"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"

[dev-dependencies]
base64 = "0.22"
litesvm = "0.16.0"
litesvm-token = "0.16.0"
solana-awesome = { version = "0.1.0", features = [
  "clock",
  "pubkey",
  "keypair",
  "signer",
  "message",
  "transaction",
] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
